<aside class="agent" id="agent" data-events="/espaces/{{ workspace.name }}/agent/evenements"
       data-base="/espaces/{{ workspace.name }}/agent" data-running="false">
  <header class="agent-bar">
    <h2>Agent</h2>
    <span class="agent-status" id="agent-status">Connexion…</span>
    <span class="agent-usage" id="agent-usage"></span>
    <button type="button" class="secondary" id="agent-new" title="Oublier cette conversation et en commencer une nouvelle">Nouvelle conversation</button>
    <button type="button" class="secondary agent-fold" id="agent-fold" title="Replier ou déplier le panneau de l'agent" aria-expanded="true">⇥</button>
  </header>
  <div class="agent-log" id="agent-log" aria-live="polite"></div>
  <div class="agent-question-slot" id="agent-question"></div>
  <p class="agent-login" id="agent-login" hidden></p>
  <p class="agent-error" id="agent-error" role="alert" hidden></p>
  <form class="agent-form" id="agent-form">
    <textarea name="message" id="agent-message" rows="3"
              placeholder="Demandez à l'agent : « Ajoute un cadre sur… », « Relis la partie 2 »… (Entrée envoie, Maj+Entrée va à la ligne)"></textarea>
    <div class="agent-actions">
      <button type="submit" id="agent-send">Envoyer</button>
      <button type="button" class="secondary" id="agent-stop" hidden>Arrêter</button>
      <button type="button" class="secondary" id="agent-undo" hidden title="Remettre les fichiers que le dernier tour de l'agent a modifiés comme ils étaient avant lui">Annuler ce tour</button>
      <span class="hint">L'agent modifie les fichiers de l'espace ; vous committez quand vous le décidez.</span>
    </div>
  </form>
</aside>
