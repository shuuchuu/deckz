{% set worktree = workspace.worktree %}
<nav class="navigator">
  <h2>Formations</h2>
  <input class="filter" type="search" placeholder="Filtrer…" aria-label="Filtrer les formations"
         oninput="for (const li of this.nextElementSibling.children) li.hidden = !li.textContent.toLowerCase().includes(this.value.toLowerCase())">
  <ul class="decks">
    {% for path in decks %}
    <li{% if path == deck %} class="current"{% endif %}><a href="/espaces/{{ workspace.name }}/formations/{{ path }}">{{ path }}</a></li>
    {% else %}
    <li class="empty">Aucune formation.</li>
    {% endfor %}
  </ul>
  <section class="problems" id="problems" hx-swap="outerHTML" hx-trigger="load"
           hx-get="/espaces/{{ workspace.name }}/problemes{% if deck %}?formation={{ deck }}&lang={{ lang }}{% endif %}">
    <h2>Problèmes</h2>
  </section>
  <section class="changes" id="changes" hx-swap="outerHTML" hx-trigger="load"
           hx-get="/espaces/{{ workspace.name }}/modifications{% if deck %}?formation={{ deck }}&lang={{ lang }}{% endif %}">
    <h2>Modifications <span class="count">{{ worktree.changes | length }}</span></h2>
  </section>
  <dialog id="commit-dialog" class="commit-dialog" aria-label="Committer"></dialog>
</nav>
