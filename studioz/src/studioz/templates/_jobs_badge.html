{#- The status bar's jobs item; `data-ended`, the last jobs ended, for
    notifications.js to notify each once. -#}
<button type="button" class="status-item jobs-badge" data-show-panel="taches"
        data-ended="{{ ended | tojson | forceescape }}"
        {% if active %}data-state="running"{% elif last %}data-state="{{ last.state.name | lower }}"{% endif %}
        title="Les tâches de l'espace : constructions, envois, publications">
  {% if active %}Tâches : {{ active | length }} en cours{% elif last %}Dernière tâche {{ last.state.value }}{% else %}Tâches{% endif %}
</button>
