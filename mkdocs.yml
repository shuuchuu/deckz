site_name: Deckz Documentation

theme:
  name: material

extra_css:
  - css/code_select.css
  - css/material_mkdocstrings.css

nav:
  - Index: index.md
  - Guide:
      - guide/index.md
      - Setting up: guide/setup.md
      - Editing and building: guide/editing.md
      - New content: guide/new-content.md
      - Translating: guide/translating.md
      - Labs and videos: guide/labs-and-videos.md
      - Before committing, teaching, publishing: guide/before-you-commit.md
      - Reviews: guide/reviews.md
      - Checks: guide/checks.md
  - Architecture:
      - architecture/index.md
      - Command line: architecture/cli.md
      - Tasks: architecture/tasks.md
      - Build pipeline: architecture/pipelines.md
      - Analyses and checks: architecture/analyzing.md
      - Components: architecture/components.md
      - Domain libraries: architecture/libraries.md
      - Foundations: architecture/foundations.md
      - The repository's plugins: architecture/plugins.md
      - studioz: architecture/studioz.md
      - Files and concurrency: architecture/state.md
  - Code Reference: reference/

# Mermaid diagrams, in docs/architecture/.
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - gen-files:
      scripts:
        - scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_symbol_type_heading: true
            members_order: source
            separate_signature: true
            filters: ["!^_"]
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true
            show_signature_annotations: true
            signature_crossrefs: true
            extensions:
              - docs/plugins/griffe_doclinks.py
          import:
            - url: https://docs.python.org/3/objects.inv
              domains: [py, std]
