[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
  {name = "NyxAether", email = "contact.nyxhemera@gmail.com"},
]
classifiers = [
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "appdirs >= 1, < 2",
  "cyclopts >= 4, < 5",
  "jinja2 >= 3, < 4",
  "pydantic >= 2, < 3",
  "pygit2 >= 1, < 2",
  "python-dotenv >= 1, < 2",
  "pyyaml >= 6, < 7",
  "rich >= 14, < 15",
  "ruamel-yaml>=0.18,<1",
  "typst >= 0.15, < 1",
  "watchfiles >= 1, < 2",
]
description = "Tool to handle multiple slide decks (Markdown to Typst)."
homepage = "https://github.com/shuuchuu/deckz"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "deckz"
readme = "README.md"
requires-python = ">= 3.13"
version = "31.3.4"

[project.optional-dependencies]
extras = [
  "email-validator >= 2, < 3",
  "google-api-python-client >= 2, < 3",
  "google-auth-oauthlib >= 1, < 2",
  "niquests >= 3, < 4",
  "sendgrid >= 6, < 7",
]
gpu = [
  "vastai >= 1, < 2",
]
labs = [
  "pillow >= 11, < 12",
]
parity = [
  "pillow >= 11, < 12",
  "playwright >= 1, < 2",
  "pypdfium2 >= 5, < 6",
]
videos = [
  "manim >= 0.18, < 1",
]

[dependency-groups]
dev = [
  "deckz[extras]",
  "deckz[labs]",
  "deckz[parity]",
  "deckz[videos]",
  "bumpver >= 2026.1132",
  "doit >= 0.37",
  "import-linter >= 2",
  "mkdocs >= 1",
  "mkdocs-gen-files >= 0.5",
  "mkdocs-literate-nav >= 0.6",
  "mkdocs-material >= 9",
  "mkdocs-section-index >= 0.3",
  "mkdocstrings[python] >= 0.29",
  "pytest >= 9",
  "pytest-cov >= 6",
  "pytest-xdist >= 3",
  "ruff >= 0.17",
  "ty >= 0.0.88",
  "types-appdirs >= 1, < 2",
  "types-pyyaml >= 6",
  "httpx2 >= 2",
  "studioz",
]

[project.scripts]
deckz = 'deckz.cli:main'

[tool.importlinter]
root_packages = ["deckz", "studioz"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "deckz's layers"
type = "layers"
containers = ["deckz"]
# Every module of deckz has its layer: a new one fails this contract until
# it's placed here, and on docs/architecture/index.md's diagram.
exhaustive = true
layers = [
  "cli",
  "agent_hooks",
  "agent_checkouts",
  "status | setting_up | scaffolding | ci_report",
  "pipelines",
  "analyzing",
  "checking | course_notes | labs | videos | hooks_install",
  "upstream",
  "components | extras | worktrees | commits | remotes",
  "drive_links | stamps",
  "configuring",
  "utils",
  "exceptions",
  "models",
]
# Known inversions, each a lazy import inside a function. Fixing one means
# removing its line here (an unmatched ignore fails the contract).
ignore_imports = [
  # `deckz show affected --since` reuses `deckz status`'s git queries.
  "deckz.analyzing.affected -> deckz.status",
  # The built-in checks registry lives with the checks themselves.
  "deckz.components.checks -> deckz.analyzing.content_checks",
  "deckz.configuring.settings -> deckz.analyzing.content_checks",
  # `parse_deck`/`all_decks`/`all_deck_settings` parse decks: they belong
  # above `components`, not in `utils`.
  "deckz.utils -> deckz.components.factory",
  "deckz.utils -> deckz.configuring.settings",
  "deckz.utils -> deckz.configuring.variables",
]
broken_contract_guidance = """
A module imports one in a layer above it: move the code it needs down a
layer, or the importing code up. Or a new module has no layer: add it to
`layers` here, and to docs/architecture/ (the diagram of index.md, and the
page of its layer).
"""

[[tool.importlinter.contracts]]
id = "terminal"
name = "Only the CLIs draw on the terminal"
type = "protected"
protected_modules = ["rich", "cyclopts"]
allowed_importers = ["deckz.cli", "studioz.cli"]
ignore_imports = [
  # Draws its own transfer progress bars, instead of taking a
  # `ProgressReporterProtocol`.
  "deckz.extras.uploading -> rich",
]
broken_contract_guidance = """
The core reports progress through a `ProgressReporterProtocol` and failures
by raising a `DeckzError`; only `deckz.cli` (`cli/_presentation.py`) renders
them.
"""

[[tool.importlinter.contracts]]
id = "factories"
name = "Concrete components are built by the factories only"
type = "protected"
protected_modules = [
  "deckz.components.assets_analyzer",
  "deckz.components.assets_builder",
  "deckz.components.assets_metadata_retriever",
  "deckz.components.assets_searcher",
  "deckz.components.html_packager",
  "deckz.components.markdown_converter",
  "deckz.components.parser",
  "deckz.components.renderer",
]
allowed_importers = ["deckz.components"]
broken_contract_guidance = """
Get the component from `GlobalSettingsFactory`/`DeckSettingsFactory`
(`deckz.components.factory`) and type it with its protocol
(`deckz.components.protocols`).
"""

[[tool.importlinter.contracts]]
id = "studioz"
name = "deckz never imports studioz"
type = "forbidden"
source_modules = ["deckz"]
forbidden_modules = ["studioz"]

[[tool.importlinter.contracts]]
id = "studioz-cli"
name = "studioz runs deckz's commands, never imports their code"
type = "forbidden"
source_modules = ["studioz"]
forbidden_modules = ["deckz.cli"]

[tool.uv.workspace]
members = ["studioz"]

[tool.uv.sources]
studioz = { workspace = true }

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
  "D1",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "non-empty-init-module",
]
preview = true
select = ["A", "B", "C", "D", "DOC", "E", "EM", "F", "I", "N", "PIE", "PTH", "RET", "RUF", "SIM", "SLF", "TC", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["private-member-access"]
"studioz/tests/*" = ["private-member-access"]

[bumpver]
commit = true
tag = true
push = true
commit_message = "Bump version to {new_version}"
current_version = "31.3.4"
pre_commit_hook = "scripts/bumpver_pre_commit.sh"
tag_message = "{new_version}"
version_pattern = "MAJOR.MINOR.PATCH"

[bumpver.file_patterns]
"pyproject.toml" = [
  '^version = "{version}"$',
  '^current_version = "{version}"$',
]
"src/deckz/__init__.py" = [
  '^__version__ = "{version}"$',
]
"studioz/pyproject.toml" = [
  '^version = "{version}"$',
  '^  "deckz == {version}",$',
]
"studioz/src/studioz/__init__.py" = [
  '^__version__ = "{version}"$',
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.1,<0.14.0"]
