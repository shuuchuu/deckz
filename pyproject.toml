[project]
authors = [
  {name = "m09", email = "142691+m09@users.noreply.github.com"},
  {name = "NyxAether", email = "contact.nyxhemera@gmail.com"},
]
classifiers = [
  "Topic :: Software Development :: Build Tools",
]
dependencies = [
  "appdirs >= 1, < 2",
  "cyclopts >= 4, < 5",
  "jinja2 >= 3, < 4",
  "pydantic >= 2, < 3",
  "pygit2 >= 1, < 2",
  "python-dotenv >= 1, < 2",
  "pyyaml >= 6, < 7",
  "rich >= 14, < 15",
  "ruamel-yaml>=0.18,<1",
  "typst >= 0.15, < 1",
  "watchfiles >= 1, < 2",
]
description = "Tool to handle multiple slide decks (Markdown to Typst)."
homepage = "https://github.com/shuuchuu/deckz"
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "deckz"
readme = "README.md"
requires-python = ">= 3.13"
version = "31.3.4"

[project.optional-dependencies]
extras = [
  "email-validator >= 2, < 3",
  "google-api-python-client >= 2, < 3",
  "google-auth-oauthlib >= 1, < 2",
  "niquests >= 3, < 4",
  "sendgrid >= 6, < 7",
]
gpu = [
  "vastai >= 1, < 2",
]
labs = [
  "pillow >= 11, < 12",
]
parity = [
  "pillow >= 11, < 12",
  "playwright >= 1, < 2",
  "pypdfium2 >= 5, < 6",
]
videos = [
  "manim >= 0.18, < 1",
]

[dependency-groups]
dev = [
  "deckz[extras]",
  "deckz[labs]",
  "deckz[parity]",
  "deckz[videos]",
  "bumpver >= 2026.1132",
  "doit >= 0.37",
  "mkdocs >= 1",
  "mkdocs-gen-files >= 0.5",
  "mkdocs-literate-nav >= 0.6",
  "mkdocs-material >= 9",
  "mkdocs-section-index >= 0.3",
  "mkdocstrings[python] >= 0.29",
  "prek >= 0.5.7",
  "pyrefly >= 1.4",
  "pytest >= 9",
  "pytest-cov >= 6",
  "pytest-xdist >= 3",
  "ruff >= 0.17",
  "types-appdirs >= 1, < 2",
  "types-pyyaml >= 6",
  "httpx2 >= 2",
  "studioz",
]

[project.scripts]
deckz = 'deckz.cli:main'

[tool.uv.workspace]
members = ["studioz"]

[tool.uv.sources]
studioz = { workspace = true }

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
ignore = [
  "D1",
  "incorrect-blank-line-before-class",
  "multi-line-summary-second-line",
  "non-empty-init-module",
]
preview = true
select = ["A", "B", "C", "D", "DOC", "E", "EM", "F", "I", "N", "PIE", "PTH", "RET", "RUF", "SIM", "SLF", "TC", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["private-member-access"]
"studioz/tests/*" = ["private-member-access"]

# Without a config, pyrefly falls back to its lenient "basic" preset. With one,
# it stops treating the project root as an import root, so tests couldn't
# import tests.conftest without search-path.
[tool.pyrefly]
# studioz/tests too, for the helpers its tests import as top-level modules.
search-path = [".", "studioz/tests"]

[bumpver]
commit = true
tag = true
push = true
commit_message = "Bump version to {new_version}"
current_version = "31.3.4"
pre_commit_hook = "scripts/bumpver_pre_commit.sh"
tag_message = "{new_version}"
version_pattern = "MAJOR.MINOR.PATCH"

[bumpver.file_patterns]
"pyproject.toml" = [
  '^version = "{version}"$',
  '^current_version = "{version}"$',
]
"src/deckz/__init__.py" = [
  '^__version__ = "{version}"$',
]
"studioz/pyproject.toml" = [
  '^version = "{version}"$',
  '^  "deckz == {version}",$',
]
"studioz/src/studioz/__init__.py" = [
  '^__version__ = "{version}"$',
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.13.6,<0.14.0"]
