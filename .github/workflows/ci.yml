name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  style:
    name: Check style conventions and test the package
    runs-on: ubuntu-latest
    container: shuuchuu/deckz-ci:latest
    # The image's apt packages bring in Debian's Python, without its headers:
    # uv would build manimpango and pycairo against it and fail.
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Install the package
        run: uv sync --all-extras

      - name: Test the package style conventions
        run: uv run doit check

      - name: Run the tests
        run: uv run pytest --cov --cov-report=xml

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
