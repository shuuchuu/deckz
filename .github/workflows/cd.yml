name: CD

on:
  push:
    tags:
      - "*.*.*"

jobs:
  deploy-pypi:
    name: Deploy to PyPI
    runs-on: ubuntu-latest
    permissions:
      # For PyPI's trusted publishing.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0

      - name: Build and deploy on PyPI
        run: |
          uv build
          uv publish
